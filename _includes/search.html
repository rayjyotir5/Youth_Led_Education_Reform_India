<div class="search-container">
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Search posts..." aria-label="Search">
        <button id="search-button" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
        </button>
    </div>
    <div id="search-results" class="search-results"></div>
</div>

<script>
// Simple client-side search
(function() {
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const searchResults = document.getElementById('search-results');
    
    // Fetch all posts data
    let postsData = [];
    
    {% for post in site.posts %}
    postsData.push({
        title: {{ post.title | jsonify }},
        url: {{ post.url | jsonify }},
        excerpt: {{ post.excerpt | default: post.subtitle | jsonify }},
        content: {{ post.content | strip_html | jsonify }}
    });
    {% endfor %}
    
    function performSearch(query) {
        if (!query || query.length < 2) {
            searchResults.innerHTML = '';
            searchResults.style.display = 'none';
            return;
        }
        
        const lowerQuery = query.toLowerCase();
        const results = postsData.filter(post => {
            return post.title.toLowerCase().includes(lowerQuery) ||
                   post.content.toLowerCase().includes(lowerQuery) ||
                   (post.excerpt && post.excerpt.toLowerCase().includes(lowerQuery));
        }).slice(0, 5);
        
        if (results.length === 0) {
            searchResults.innerHTML = '<p class="no-results">No results found.</p>';
        } else {
            searchResults.innerHTML = results.map(post => `
                <div class="search-result-item">
                    <h4><a href="${post.url}">${post.title}</a></h4>
                    <p>${post.excerpt || post.content.substring(0, 150)}...</p>
                </div>
            `).join('');
        }
        
        searchResults.style.display = 'block';
    }
    
    searchInput.addEventListener('input', function() {
        performSearch(this.value);
    });
    
    searchButton.addEventListener('click', function() {
        performSearch(searchInput.value);
    });
    
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch(this.value);
        }
    });
    
    // Close results when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            searchResults.style.display = 'none';
        }
    });
})();
</script>
